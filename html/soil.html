<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Different Soils - Agriculture Helper</title>
    <style>
        /* CSS starts here */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #fdfdfb;
            color: #333;
            text-align: center;
        }

        /* Navigation Bar */
        nav {
            background-color: #22c55e;
            padding: 15px 0;
            margin-bottom: 30px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: 500;
        }

        /* Page Title Box */
        .title-box {
            background-color: #2d5a27;
            color: white;
            display: inline-block;
            padding: 15px 50px;
            border-radius: 10px;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 40px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            max-width: calc(100% - 32px);
            overflow-wrap: anywhere;
        }

        /* Main Container for Crops */
        .crops-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Individual Crop Card */
        .crop-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
            border: 1px solid #ddd;
        }

        .crop-card:hover {
            transform: scale(1.05);
        }

        .crop-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        .crop-name {
            background-color: #f0f0e0;
            padding: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #2d5a27;
            border-top: 2px solid #2d5a27;
        }

        footer {
            margin-top: 50px;
            background: #2d5a27;
            color: white;
            padding: 20px;
        }

        @media (max-width: 480px) {
            .title-box { padding: 13px 18px; font-size: 20px; }
            .crops-grid { grid-template-columns: 1fr; padding: 16px; }
            .crop-card:hover { transform: none; }
        }
    </style>
    <link rel="stylesheet" href="/static/css/navbar.css?v=20261017-9">
</head>
<body>

    {% include '_navbar.html' %}

    <div class="title-box">
         DIFFERENT SOIL PAGE
    </div>

    <div class="crops-grid">
        {% for soil_id, soil in soils.items() %}
        <a href="/soil/{{ soil_id }}" style="text-decoration: none; color: inherit;">
            <div class="crop-card">
                <img src="{{ soil.image }}" alt="{{ soil.name }}">
                <div class="crop-name">{{ soil.name }}</div>
            </div>
        </a>
        {% endfor %}
    </div>


    <footer>
        &copy; 2026 Agriculture Helper Portal
    </footer>

    <script src="/static/css/navbar.js?v=20261017-9"></script>
</body>
</html>
