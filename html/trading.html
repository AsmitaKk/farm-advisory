<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ crop.crop }} - Live Trading</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: white;
        }

        /* Nav */
        nav {
            background-color: #1e293b;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-logo img {
            height: 40px;
            width: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .nav-logo span {
            font-weight: bold;
            font-size: 1.2rem;
        }

        .back-btn {
            background: #334155;
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: 500;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #475569;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 20px;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
            height: calc(100vh - 75px);
        }

        .panel {
            background: #1e293b;
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
        }

        /* Header Info */
        .ticker-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #334155;
        }

        .ticker-name h1 {
            font-size: 2rem;
            color: #f8fafc;
        }

        .ticker-name p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-top: 5px;
            text-transform: uppercase;
        }

        .ticker-price {
            text-align: right;
        }

        .current-price {
            font-size: 2.5rem;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
        }

        .price-up {
            color: #22c55e;
        }

        .price-down {
            color: #ef4444;
        }

        .chart-container {
            flex-grow: 1;
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 400px;
        }

        /* Order Panel */
        .order-panel h2 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #334155;
        }

        .order-input {
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 5px;
            font-size: 1rem;
        }

        .order-input:focus {
            outline: none;
            border-color: #38bdf8;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-buy {
            flex: 1;
            background: #22c55e;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-buy:hover {
            background: #16a34a;
        }

        .btn-sell {
            flex: 1;
            background: #ef4444;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-sell:hover {
            background: #dc2626;
        }

        .order-book {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .order-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed #334155;
        }

        .qty-buy {
            color: #22c55e;
        }

        .qty-sell {
            color: #ef4444;
        }
    </style>
    <link rel="stylesheet" href="/static/css/navbar.css?v=20261017-9">
</head>

<body>

    {% include '_navbar.html' %}

    <div class="dashboard">
        <!-- Main Chart Panel -->
        <div class="panel">
            <div class="ticker-header">
                <div class="ticker-name">
                    <h1>{{ crop.crop }}</h1>
                    <p>Commodity ID: AGRI-{{ crop.id | upper }} | Variety: {{ crop.variety }}</p>
                </div>
                <div class="ticker-price">
                    <div id="livePrice" class="current-price price-up">â‚¹ {{ crop.price_val }}</div>
                    <div style="font-size: 0.9rem; color: #94a3b8;">Updated Just Now</div>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="tradingChart"></canvas>
            </div>
        </div>

        <!-- Trading / Order Panel -->
        <div class="panel">
            <div class="order-panel">
                <h2>Place Order</h2>
                <form id="tradeForm" action="/trade-action" method="POST">
                    <input type="hidden" name="crop_id" value="{{ crop.id }}">
                    <input type="hidden" name="action" id="tradeAction" value="BUY">

                    <label style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 5px; display: block;">Price
                        (â‚¹)</label>
                    <input type="number" name="price" id="orderPrice" class="order-input" value="{{ crop.price_val }}"
                        readonly>

                    <label style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 5px; display: block;">Amount
                        (Quintals)</label>
                    <input type="number" name="quantity" class="order-input" value="10" min="1">

                    <div class="btn-group">
                        <button type="button" class="btn-buy" onclick="submitTrade('BUY')">BUY</button>
                        <button type="button" class="btn-sell" onclick="submitTrade('SELL')">SELL</button>
                    </div>
                </form>
            </div>

            <script>
                function submitTrade(action) {
                    document.getElementById('tradeAction').value = action;
                    document.getElementById('tradeForm').submit();
                }
            </script>

            <div class="order-book">
                <h3 style="color: white; margin-bottom: 15px; font-size: 1rem;">Live Order Book</h3>
                <div class="order-row" style="font-weight: bold; color: white;">
                    <span>Price</span><span>Size</span>
                </div>
                <div id="orderBookRows"></div>
            </div>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('tradingChart').getContext('2d');
        let currentPrice = {{ crop.price_val }};
        const basePrice = currentPrice;

        // Generate historical mock data for the chart layout
        const labels = Array.from({ length: 40 }, (_, i) => {
            let d = new Date();
            d.setMinutes(d.getMinutes() - (40 - i));
            return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        });

        // Generate a random walk for historical points
        let tempPrice = basePrice * 0.98; // start slightly lower
        const dataPoints = labels.map(() => {
            tempPrice = tempPrice + (Math.random() - 0.48) * (basePrice * 0.005);
            return tempPrice;
        });

        // Chart setup
        const gradient = ctx.createLinearGradient(0, 0, 0, 400);
        gradient.addColorStop(0, 'rgba(34, 197, 94, 0.4)');
        gradient.addColorStop(1, 'rgba(34, 197, 94, 0.0)');

        const myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: '{{ crop.crop }} Price',
                    data: dataPoints,
                    borderColor: '#22c55e',
                    backgroundColor: gradient,
                    borderWidth: 2,
                    pointRadius: 0,
                    fill: true,
                    tension: 0.1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                    y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } }
                },
                animation: {
                    duration: 400
                }
            }
        });

        // Simulate Live Price Ticks
        setInterval(() => {
            // Random price movement (-0.2% to +0.2%)
            const change = (Math.random() - 0.48) * (basePrice * 0.004);
            currentPrice = currentPrice + change;

            // Update UI
            const priceEl = document.getElementById('livePrice');
            priceEl.innerText = 'â‚¹ ' + currentPrice.toFixed(2);
            document.getElementById('orderPrice').value = currentPrice.toFixed(2);

            // Flash green/red
            if (change >= 0) {
                priceEl.className = 'current-price price-up';
                myChart.data.datasets[0].borderColor = '#22c55e'; // Green
            } else {
                priceEl.className = 'current-price price-down';
                myChart.data.datasets[0].borderColor = '#ef4444'; // Red
            }

            // Update Chart Data
            const now = new Date();
            myChart.data.labels.shift();
            myChart.data.labels.push(now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
            myChart.data.datasets[0].data.shift();
            myChart.data.datasets[0].data.push(currentPrice);
            myChart.update();

            // Randomize order book
            updateOrderBook();

        }, 2000);

        function updateOrderBook() {
            const container = document.getElementById('orderBookRows');
            container.innerHTML = '';
            // Generate 3 sells and 3 buys around current price
            for (let i = 3; i >= 1; i--) {
                const p = (currentPrice + (i * basePrice * 0.001)).toFixed(2);
                const s = Math.floor(Math.random() * 50) + 1;
                container.innerHTML += `<div class="order-row"><span class="qty-sell">â‚¹ ${p}</span><span>${s}</span></div>`;
            }
            container.innerHTML += `<div class="order-row" style="margin: 5px 0;"><span style="color:white;font-weight:bold;">â‚¹ ${currentPrice.toFixed(2)}</span><span>--</span></div>`;
            for (let i = 1; i <= 3; i++) {
                const p = (currentPrice - (i * basePrice * 0.001)).toFixed(2);
                const s = Math.floor(Math.random() * 50) + 1;
                container.innerHTML += `<div class="order-row"><span class="qty-buy">â‚¹ ${p}</span><span>${s}</span></div>`;
            }
        }
        updateOrderBook(); // Initial call
    </script>
    <script src="/static/css/navbar.js?v=20261017-9"></script>
</body>

</html>
